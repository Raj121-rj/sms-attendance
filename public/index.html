<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#14532d"><title>Staff Attendance</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,"Noto Sans Devanagari",sans-serif;background:#f4f6f2;color:#1c2a22}
header{background:#14532d;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:15px}header a{color:#fde68a}
main{max-width:860px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dfe5da;border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:21px}input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #b9c4b5;border-radius:8px;font:inherit;background:#fff}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:12px;background:#14532d;color:#fff;font:700 19px system-ui;margin:8px 0;cursor:pointer;text-align:center}
.btn:disabled{background:#c7cfc4;color:#707a6e}.in{background:#15803d}.out{background:#b45309}.sm{display:inline-block;width:auto;min-height:40px;font-size:14px;padding:0 14px;margin:2px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{background:#fff;border:1px solid #dfe5da;border-radius:10px;padding:10px;text-align:center;font-size:13px}.k b{display:block;font-size:26px}
.chip{padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:#e5e7eb}.Present{background:#dcfce7;color:#166534}.Late{background:#fef3c7;color:#92400e}.Half{background:#fed7aa;color:#9a3412}.Absent{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid #e5e9e2;text-align:left}.w{overflow-x:auto}.err{color:#b91c1c}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{flex:none;padding:10px 16px;border:0;border-radius:99px;background:#dde5d9;font:600 14px system-ui}.tabs .on{background:#14532d;color:#fff}
#scan{position:fixed;inset:0;background:#000e;z-index:9;padding:16px;color:#fff;text-align:center}#qrbox{max-width:340px;margin:16px auto}
@media print{body *{visibility:hidden}#qrp,#qrp *{visibility:visible}#qrp{position:absolute;left:0;top:0;width:100%;text-align:center}}
</style></head><body>
<header><b>S.M.S. Jain Public Sr. Sec. School, Momasar</b><span id=hb></span></header>
<main id=app></main>
<div id=scan hidden><h2>Scan the school QR</h2><div id=qrbox></div><button class="btn sm" onclick=stop()>Cancel</button></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let U=null,tab='today',sortBy='latest',sc;
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
T=t=>t?new Date(t).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase():'—',
dur=(a,b)=>{const m=Math.round((new Date(b)-new Date(a))/6e4);return Math.floor(m/60)+'h '+m%60+'m'},
chip=s=>`<span class="chip ${esc(s.split(' ')[0])}">${esc(s)}</span>`,
msg=h=>{const m=$('#m');if(m)m.innerHTML=h},
fail=e=>{const t=$('#t')||$('#v');if(t)t.innerHTML='<div class="card err">❌ '+esc(e.message)+'</div>'};
async function api(p,b){let r;
 try{r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})}
 catch{throw new Error('Internet connection is unavailable. Nothing was saved.')}
 const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='login'&&U){U=null;draw()}
 if(!r.ok)throw new Error(j.e||'Not allowed');return j}
function draw(){
 $('#hb').innerHTML=U?`${esc(U.name)} · <a href=# onclick="out();return false">Logout</a>`:'';
 $('#app').innerHTML=!U?`<div class=card><h2>Staff Login · स्टाफ लॉगिन</h2><input id=u placeholder="Username" autocomplete=username autocapitalize=none><input id=p type=password placeholder="Password" autocomplete=current-password><button class=btn onclick=login()>Login</button><p id=m class=err></p><small>🔒 Privacy: your location is read only at the moment you tap Mark IN or Mark OUT. It is never tracked in the background. Only latitude, longitude and accuracy are saved with that attendance.</small></div>`
 :U.must_change?`<div class=card><h2>Set a new password</h2><p>The default password must be changed before you continue.</p><input id=n type=password placeholder="New password (8+ characters)"><button class=btn onclick=setpw()>Save password</button><p id=m class=err></p></div>`:'<div id=v></div>';
 if(U&&!U.must_change)U.role==='admin'?adm():tch().catch(fail)}
async function login(){try{U=await api('login',{username:$('#u').value,password:$('#p').value});draw()}catch(e){msg(esc(e.message))}}
async function out(){await api('logout',{}).catch(()=>{});U=null;draw()}
async function setpw(){try{await api('password',{pw:$('#n').value});U.must_change=false;draw()}catch(e){msg(esc(e.message))}}

// ---------- Teacher ----------
async function tch(){
 const j=await api('history'),t=j.rows.find(r=>r.d===j.today),mo=j.rows.filter(r=>r.d.slice(0,7)===j.today.slice(0,7)),c=s=>mo.filter(r=>r.status===s).length,
 h=+new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata',hour:'numeric',hour12:false}),g=h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening';
 $('#v').innerHTML=`<div class=card><h2>${g}, ${esc(U.name)}</h2><b>Today's Attendance</b>
 <p>IN: <b>${T(t?.in_time)}</b> ${t?chip(t.status):''}<br>OUT: <b>${t?.out_time?T(t.out_time)+' · Total '+dur(t.in_time,t.out_time):'Not marked'}</b></p>
 <button class="btn in" ${t?'disabled':''} onclick="mark('in')">Mark IN · हाज़िरी लगाएँ</button>
 <button class="btn out" ${!t||t.out_time?'disabled':''} onclick="mark('out')">Mark OUT · छुट्टी लगाएँ</button><p id=m></p></div>
 <div class=card><b>This month</b><div class=g style=margin-top:8px><div class=k><b>${c('Present')}</b>Present</div><div class=k><b>${c('Late')}</b>Late</div><div class=k><b>${c('Half Day')}</b>Half Day</div></div></div>
 <div class="card w"><b>Attendance History</b><table><tr><th>Date<th>IN<th>OUT<th>Status</tr>${j.rows.map(r=>`<tr><td>${r.d.split('-').reverse().join('/')}<td>${T(r.in_time)}<td>${r.out_time?T(r.out_time):r.d===j.today?'—':'<small>OUT not recorded</small>'}<td>${chip(r.status)}`).join('')}</table></div>`}
function mark(type){
 if(!navigator.geolocation)return msg('❌ This phone cannot provide GPS.');
 msg('📍 Checking your location…');
 navigator.geolocation.getCurrentPosition(p=>scan(type,p.coords),e=>msg(e.code===1?'❌ Location permission is required to mark attendance.':'❌ Could not get your location. Please try again.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function scan(type,c){
 $('#scan').hidden=false;sc=new Html5Qrcode('qrbox');
 sc.start({facingMode:'environment'},{fps:10,qrbox:240},t=>{if($('#scan').hidden)return;$('#scan').hidden=true;stop();send(type,c,t)},()=>{}).catch(()=>{stop();msg('❌ Camera permission is required to scan the school QR.')})}
async function stop(){try{await sc.stop();sc.clear()}catch{}$('#scan').hidden=true}
async function send(type,c,qr){
 msg('Saving…');
 try{const r=await api('mark',{type,lat:c.latitude,lng:c.longitude,acc:c.accuracy,qr});await tch();
  msg(`✅ <b>Attendance marked successfully</b><br>${esc(U.name)}<br>${type.toUpperCase()} Time: <b>${T(r[type+'_time'])}</b><br>GPS: Verified ✓ · QR: Verified ✓${r.status?'<br>Status: '+chip(r.status):''}${type==='out'?'<br>Total: '+dur(r.in_time,r.out_time):''}`)}
 catch(e){msg('❌ '+esc(e.message))}}

// ---------- Admin ----------
function adm(){
 $('#v').innerHTML=`<div class=tabs>${[['today','Today'],['staff','Staff'],['settings','Settings'],['qr','School QR']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';adm()">${l}</button>`).join('')}</div><div id=t></div>`;
 ({today:tToday,staff:tStaff,settings:tSet,qr:tQr})[tab]().catch(fail)}
async function tToday(){
 const{d,rows,notes}=await api('admin/today'),n=s=>rows.filter(r=>r.status===s).length,ins=rows.filter(r=>r.in_time&&!r.out_time).length,
 by={latest:(a,b)=>(b.in_time||'').localeCompare(a.in_time||''),earliest:(a,b)=>(a.in_time||'9').localeCompare(b.in_time||'9'),name:(a,b)=>a.name.localeCompare(b.name),status:(a,b)=>a.status.localeCompare(b.status)};
 rows.sort(by[sortBy]);
 $('#t').innerHTML=`<div class=g>${[['Present',n('Present')],['Late',n('Late')],['Half Day',n('Half Day')],['Absent',n('Absent')],['Not Marked',n('Not Marked')],['Currently In School',ins]].map(([l,v])=>`<div class=k><b>${v}</b>${l}</div>`).join('')}</div>
 <div class=card style=margin-top:12px><select onchange="sortBy=this.value;tToday()">${['latest','earliest','name','status'].map(o=>`<option ${o===sortBy?'selected':''}>${o}</option>`).join('')}</select>
 <div class=w><table><tr><th>Teacher<th>IN<th>OUT<th>Status<th>GPS<th>QR</tr>${rows.map(r=>`<tr><td>${esc(r.name)}<td>${T(r.in_time)}<td>${T(r.out_time)}<td>${chip(r.status)}<td>${r.in_time?'✓':'—'}<td>${r.in_time?'✓':'—'}`).join('')}</table></div></div>
 <div class=card><b>🔔 Recent activity</b>${notes.map(x=>`<p>${esc(x.msg)}</p>`).join('')||'<p>No activity yet.</p>'}</div>
 <div class=card><b>Monthly report</b><input type=month id=mo value="${d.slice(0,7)}"><a class=btn href=# onclick="this.href='/api/admin/report?month='+$('#mo').value">Download CSV</a></div>`}
async function tStaff(){
 const L=await api('admin/staff');
 $('#t').innerHTML=`<div class="card w"><table>${L.map(u=>`<tr><td>${esc(u.name)}<br><small>${esc(u.staff_code)} · ${esc(u.username)}${u.active?'':' · DISABLED'}</small><td><button class="btn sm" onclick="tog(${u.id},${!u.active})">${u.active?'Disable':'Enable'}</button><button class="btn sm" onclick="rst(${u.id})">Reset password</button>`).join('')}</table></div>
 <div class=card><b>Add staff</b>${[['nm','Full name'],['sc','Staff ID (e.g. STAFF006)'],['mb','Mobile number'],['un','Username'],['pw','Temporary password (8+ characters)']].map(([i,p])=>`<input id=${i} placeholder="${p}">`).join('')}<button class=btn onclick=addst()>Add staff</button><p id=m class=err></p></div>`}
const tog=async(id,a)=>{await api('admin/staff/'+id,{active:a}).catch(e=>alert(e.message));tStaff()},
rst=async id=>{const p=prompt('New temporary password (8+ characters):');if(p)try{await api('admin/staff/'+id,{password:p});alert('Done. The teacher must set a new password at next login.')}catch(e){alert(e.message)}},
addst=async()=>{try{await api('admin/staff',{name:$('#nm').value,staff_code:$('#sc').value,mobile:$('#mb').value,username:$('#un').value,password:$('#pw').value});tStaff()}catch(e){msg(esc(e.message))}};
async function tSet(){
 const s=await api('admin/settings'),F=[['school_name','School name'],['start','School start (24-hour, e.g. 07:15)'],['present_until','Present until'],['late_until','Late until / Half Day after'],['end','School end'],['lat','GPS latitude'],['lng','GPS longitude'],['radius','Allowed radius (metres)']];
 $('#t').innerHTML=`<div class=card>${F.map(([k,l])=>`<label>${l}<input id=s_${k} value="${esc(s[k])}"></label>`).join('')}<label>Allow OUT attendance<select id=s_allow_out><option value=yes ${s.allow_out==='yes'?'selected':''}>Yes<option value=no ${s.allow_out==='no'?'selected':''}>No</select></label>
 <button class="btn out" onclick=here()>📍 Use my current location as school</button><button class=btn onclick=saveS()>Save settings</button><p id=m></p></div>`}
const here=()=>navigator.geolocation.getCurrentPosition(p=>{$('#s_lat').value=p.coords.latitude.toFixed(6);$('#s_lng').value=p.coords.longitude.toFixed(6);msg('Location filled in. Tap Save settings.')},()=>msg('Location permission is required.'),{enableHighAccuracy:true}),
saveS=async()=>{const b={};['school_name','start','present_until','late_until','end','lat','lng','radius','allow_out'].forEach(k=>b[k]=$('#s_'+k).value);try{await api('admin/settings',b);msg('✅ Settings saved')}catch(e){msg('❌ '+esc(e.message))}};
async function tQr(){
 const{img}=await api('admin/qr');
 $('#t').innerHTML=`<div class=card><div id=qrp><h2>S.M.S. Jain Public Sr. Sec. School, Momasar</h2><h3>Staff attendance QR: scan to mark IN / OUT</h3><img src="${img}" width=320 alt="School QR"></div><button class=btn onclick=print()>🖨️ Print QR</button><button class="btn out" onclick=newQr()>Make a new QR (old printed QR stops working)</button></div>`}
const newQr=async()=>{if(confirm('The old printed QR will stop working. Continue?')){await api('admin/qr/new',{});tQr()}};
setInterval(()=>{if(U&&U.role==='admin'&&!U.must_change&&tab==='today'&&$('#t')&&!document.activeElement.matches('input,select'))tToday().catch(()=>{})},30000);
api('me').then(u=>{U=u}).catch(()=>{}).finally(draw);
</script></body></html>
