<!doctype html><html lang=hi><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#14532d"><title>स्टाफ उपस्थिति</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,"Noto Sans Devanagari",sans-serif;background:#f4f6f2;color:#1c2a22}
header{background:#14532d;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:15px}header a{color:#fde68a}
main{max-width:860px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dfe5da;border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:21px}input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #b9c4b5;border-radius:8px;font:inherit;background:#fff}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:12px;background:#14532d;color:#fff;font:700 19px system-ui;margin:8px 0;cursor:pointer;text-align:center}
.btn:disabled{background:#c7cfc4;color:#707a6e}.in{background:#15803d}.out{background:#b45309}.sm{display:inline-block;width:auto;min-height:40px;font-size:14px;padding:0 14px;margin:2px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{background:#fff;border:1px solid #dfe5da;border-radius:10px;padding:10px;text-align:center;font-size:13px}.k b{display:block;font-size:26px}
.chip{padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:#e5e7eb}.On{background:#dcfce7;color:#166534}.Leave{background:#e0e7ff;color:#3730a3}.Late{background:#fef3c7;color:#92400e}.Half{background:#fed7aa;color:#9a3412}.Absent{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid #e5e9e2;text-align:left}.w{overflow-x:auto}.err{color:#b91c1c}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{flex:none;padding:10px 16px;border:0;border-radius:99px;background:#dde5d9;font:600 14px system-ui}.tabs .on{background:#14532d;color:#fff}
#scan{position:fixed;inset:0;background:#000e;z-index:9;padding:16px;color:#fff;text-align:center}#qrbox{max-width:340px;margin:16px auto}
@media print{.np,header,.tabs{display:none!important}body.pq *{visibility:hidden}body.pq #qrp,body.pq #qrp *{visibility:visible}body.pq #qrp{position:absolute;left:0;top:0;width:100%;text-align:center}}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}.cg button{padding:6px 0;border:1px solid #dfe5da;border-radius:8px;background:#fff;font:inherit;min-height:50px}.cg i{display:block}.danger{background:#b91c1c}#cele{position:fixed;inset:0;z-index:20;background:rgba(10,40,25,.8);display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;animation:fi .3s}.cc{position:relative;background:linear-gradient(160deg,#fff,#f0fdf4);border-radius:20px;padding:24px 18px;text-align:center;max-width:420px;box-shadow:0 0 36px #facc1566;animation:pop .6s cubic-bezier(.2,1.4,.4,1),gl 2.4s .6s 1}.cc h2{font-size:22px;color:#14532d}.ck{width:72px;height:72px;display:block;margin:0 auto 6px}.ck circle{fill:#16a34a}.ck path{stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .6s .35s forwards}#cele i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:fall 2.4s ease-in forwards}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fi{from{opacity:0}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes gl{50%{box-shadow:0 0 60px #facc15aa}}@keyframes fall{to{transform:translateY(110vh) rotate(var(--r));opacity:.3}}@media(prefers-reduced-motion:reduce){.cc,.ck path{animation:none}.ck path{stroke-dashoffset:0}}</style></head><body>
<header><b>S.M.S. Jain Public Sr. Sec. School, Momasar</b><span id=hb></span></header>
<main id=app></main>
<div id=scan hidden><h2>विद्यालय का QR Code स्कैन करें</h2><div id=qrbox></div><button class="btn sm" onclick=stop()>रद्द करें</button></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let U=null,tab='today',cat=0,sc;
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
T=t=>t?new Date(t).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase():'—',
dur=(a,b)=>{const m=Math.round((new Date(b)-new Date(a))/6e4);return Math.floor(m/60)+' घंटे '+m%60+' मिनट'},
dm=d=>d.split('-').reverse().join('/'),
L={'Half Day':'आधा दिन','On Time':'समय पर','Late':'देर से','Absent':'अनुपस्थित','Leave':'छुट्टी','Pending':'लंबित','Approved':'स्वीकृत','Rejected':'अस्वीकृत'},
chip=s=>`<span class="chip ${esc(s.split(' ')[0])}">${esc(L[s]||s)}</span>`,
msg=h=>{const m=$('#m');if(m)m.innerHTML=h},
fail=e=>{const t=$('#t')||$('#v');if(t)t.innerHTML='<div class="card err">❌ '+esc(e.message)+'</div>'},
V=(...i)=>Object.fromEntries(i.map(k=>[k,$('#'+k).value])),
F=(a,go,btn)=>a.map(([i,l,t,o])=>`<label>${l}${t==='s'?`<select id=${i}>${o.map(([v,x])=>`<option value="${esc(v)}">${esc(x)}</option>`).join('')}</select>`:`<input id=${i} type=${t||'text'}>`}</label>`).join('')+`<button class=btn onclick="${go}">${btn}</button>`,
speak=t=>{try{if(localStorage.vc==='0'||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),v=speechSynthesis.getVoices().find(v=>/^hi/i.test(v.lang));u.lang='hi-IN';if(v)u.voice=v;u.volume=.85;u.rate=.95;u.onstart=()=>{window.spoke=true};speechSynthesis.speak(u)}catch{}};
async function api(p,b){let r;
 try{r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})}
 catch{throw new Error('इंटरनेट उपलब्ध नहीं है। कुछ भी सहेजा नहीं गया।')}
 const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='login'&&U){U=null;draw()}
 if(!r.ok)throw new Error(j.e||'कुछ तकनीकी समस्या आ गई है। कृपया दोबारा प्रयास करें।');return j}
function draw(){
 $('#hb').innerHTML=U?`${esc(U.name)} · <a href=# onclick="out();return false">Logout</a>`:'';
 $('#app').innerHTML=!U?`<div class=card><h2>स्टाफ लॉगिन</h2><input id=u placeholder="यूज़रनेम" autocomplete=username autocapitalize=none><input id=p type=password placeholder="पासवर्ड" autocomplete=current-password><button class=btn onclick=login()>लॉगिन</button><p id=m class=err></p><small>🔒 गोपनीयता: आपकी लोकेशन केवल IN / OUT उपस्थिति दर्ज करते समय एक बार जाँची जाती है। उसे लगातार ट्रैक नहीं किया जाता। उस उपस्थिति के साथ केवल अक्षांश, देशांतर और सटीकता सहेजी जाती है।</small></div>`
 :U.must_change?`<div class=card><h2>नया पासवर्ड बनाएँ</h2><p>आगे बढ़ने से पहले डिफ़ॉल्ट पासवर्ड बदलना ज़रूरी है।</p><input id=n type=password placeholder="नया पासवर्ड (कम से कम 8 अक्षर)"><button class=btn onclick=setpw()>पासवर्ड सहेजें</button><p id=m class=err></p></div>`:'<div id=v></div>';
 if(U&&!U.must_change)U.role==='admin'?adm():tch().catch(fail)}
async function login(){try{U=await api('login',{username:$('#u').value,password:$('#p').value});draw()}catch(e){msg(esc(e.message))}}
async function out(){await api('logout',{}).catch(()=>{});U=null;draw()}
async function setpw(){try{await api('password',{pw:$('#n').value});U.must_change=false;draw()}catch(e){msg(esc(e.message))}}

// ---------- स्टाफ ----------
async function tch(){
 const[j,s,k]=await Promise.all([api('history'),api('summary'),api('streak').catch(()=>({current:0,best:0}))]),t=j.rows.find(r=>r.d===j.today),h=+s.hm.slice(0,2),g=h<12?'सुप्रभात':h<17?'नमस्कार':'शुभ संध्या',
 c=(n,l)=>`<div class=k><b>${n}</b>${l}</div>`,tot=s.ontime+s.late,pct=tot?Math.round(s.ontime*100/tot):0,df=s.ontime-s.prev_ontime,
 list=(a,f)=>a.map(f).join('');
 $('#v').innerHTML=`<div class=card><h2>${g}, ${esc(U.name)}</h2><b>🌞 आज की उपस्थिति</b>
 <p>आज की IN: <b>${T(t?.in_time)}</b> ${t?.status?chip(t.status):''}${t?.late_min?' · '+t.late_min+' मिनट देर':''}${t?.half_reason?'<br><small>आधा दिन: '+HR[t.half_reason]+'</small>':''}<br>OUT: <b>${t?.out_time?T(t.out_time)+' · कुल '+dur(t.in_time,t.out_time):'अभी दर्ज नहीं'}</b>${k.current>0?'<br>🔥 लगातार '+k.current+' दिन समय पर':''}</p>
 ${t?.in_time&&!t.out_time&&s.hm>=s.end?'<p class=err>⏰ आपकी OUT उपस्थिति अभी दर्ज नहीं हुई है।</p>':''}
 <button class="btn in" ${t?'disabled':''} onclick="scan('in')">IN उपस्थिति दर्ज करें</button>
 <button class="btn out" ${!t?.in_time||t.out_time?'disabled':''} onclick="scan('out')">OUT उपस्थिति दर्ज करें</button>
 <label><input type=checkbox style="width:auto" ${localStorage.vc==='0'?'':'checked'} onchange="localStorage.vc=this.checked?'1':'0'"> 🔊 आवाज़ में संदेश सुनाएँ</label><p id=m></p></div>
 <div class=card><b>इस माह का सार</b><div class=g style=margin-top:8px>${c(s.ontime,'समय पर')}${c(s.late,'देर से')}${c(s.full,'छुट्टी (दिन)')}${c(s.half,'आधा दिन (प्रत्येक 0.5)')}${c(s.absent,'अनुपस्थित')}${c(s.outmiss,'OUT दर्ज नहीं')}</div>
 <p>कुल छुट्टी (आधे दिन जोड़कर): <b>${s.total_leave}</b> दिन<br>🕒 कुल देर का समय (इस माह): <b>${s.late_fmt}</b><br>समय पर प्रतिशत: <b>${pct}%</b><br>पिछले माह समय पर: ${s.prev_ontime} दिन · इस माह: ${s.ontime} दिन<br>${df>=0?'सुधार: +'+df+' दिन 👍':'पिछले माह से '+(-df)+' दिन कम'}<br>🔥 आपकी वर्तमान समय-पाबंदी: <b>${k.current}</b> दिन लगातार<br>🏆 आपकी सबसे अच्छी streak: <b>${k.best}</b> दिन</p></div><div class=card><b>उपस्थिति कैलेंडर</b><input type=month id=cm value="${j.today.slice(0,7)}" onchange=cal()><div id=cal></div></div>
 <details class=card><summary><b>छुट्टी / आधे दिन का अनुरोध</b></summary>${F([['l_k','प्रकार','s',[['full','पूरा दिन'],['half','आधा दिन']]],['l_f','से तारीख','date'],['l_t','तक (आधे दिन में खाली)','date'],['l_r','कारण'],['l_n','टिप्पणी (वैकल्पिक)']],'lv()','अनुरोध भेजें')}${list(s.leaves,l=>`<p>${dm(l.f)}${l.t!==l.f?' – '+dm(l.t):''} · ${l.kind==='half'?'आधा दिन':'पूरा दिन'} · ${chip(l.status)}</p>`)}</details>
 <details class=card><summary><b>उपस्थिति सुधार अनुरोध</b></summary>${F([['c_d','तारीख','date'],['c_r','कारण (जैसे: मेरी OUT उपस्थिति दर्ज नहीं हुई)']],'cr()','अनुरोध भेजें')}${list(s.corr,x=>`<p>${dm(x.d)} · ${chip(x.status)}</p>`)}</details>
 <div class=card><b>🔔 सूचनाएँ</b>${list(s.notes,x=>`<p>${esc(x.msg)}</p>`)||'<p>कोई नई सूचना नहीं।</p>'}</div>
 <div class=card><b>उपस्थिति इतिहास और सार</b><select id=pr onchange=pre()>${R.map(([k,l])=>`<option value=${k}>${l}</option>`).join('')}</select><input id=rf type=date><input id=rt type=date><button class="btn sm" onclick=srep()>दिखाएँ</button><div id=rr></div></div>`;U.today=j.today;$('#pr').value='mo';pre();cal()}
const lv=async()=>{const v=V('l_k','l_f','l_t','l_r','l_n');try{await api('leave',{kind:v.l_k,from:v.l_f,to:v.l_t||v.l_f,reason:v.l_r,note:v.l_n});alert('✅ अनुरोध भेज दिया गया');tch()}catch(e){alert(e.message)}},
cr=async()=>{const v=V('c_d','c_r');try{await api('correction',{date:v.c_d,reason:v.c_r});alert('✅ अनुरोध भेज दिया गया');tch()}catch(e){alert(e.message)}};
function scan(type){ // 1) QR  2) GPS  3) server verifies everything and records server time
 $('#scan').hidden=false;try{const p=new SpeechSynthesisUtterance(' ');p.volume=0;speechSynthesis.speak(p)}catch{} sc=new Html5Qrcode('qrbox');
 sc.start({facingMode:'environment'},{fps:10,qrbox:240},t=>{if($('#scan').hidden)return;$('#scan').hidden=true;stop();gps(type,t)},()=>{}).catch(()=>{stop();msg('❌ QR स्कैन के लिए कैमरे की अनुमति आवश्यक है।')})}
function gps(type,qr){
 if(!navigator.geolocation)return msg('❌ इस फ़ोन में GPS उपलब्ध नहीं है।');
 msg('📍 आपकी लोकेशन जाँची जा रही है…');
 navigator.geolocation.getCurrentPosition(p=>send(type,p.coords,qr),e=>msg(e.code===1?'❌ GPS की अनुमति आवश्यक है।':'❌ लोकेशन नहीं मिली। कृपया दोबारा प्रयास करें।'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
async function stop(){try{await sc.stop();sc.clear()}catch{}$('#scan').hidden=true}
async function send(type,c,qr){
 msg('सहेजा जा रहा है…');
 try{const r=await api('mark',{type,lat:c.latitude,lng:c.longitude,acc:c.accuracy,qr});await tch();
  const ok=type==='in'&&r.status==='On Time',nm=esc(U.name);let h='',say='';
  if(type==='in'&&r.status==='Half Day'){say=`सुप्रभात ${U.name}। आज आपकी उपस्थिति आधा दिन दर्ज हुई है।`;h=`सुप्रभात, ${nm}। 🌞<br>आज आपकी उपस्थिति <b>${T(r.in_time)}</b> पर दर्ज हुई।<br>IN का समय ${esc(r.half)} के बाद होने से आज की उपस्थिति <b>आधा दिन (Half Day)</b> दर्ज हुई है।<br>देर: <b>${r.late_min} मिनट</b> (रिकॉर्ड में सुरक्षित)।`}else if(type==='in'&&!ok){say=`सुप्रभात ${U.name}। आज आपकी उपस्थिति ${r.late_min} मिनट देर से दर्ज हुई है। कल ${r.cut} से पहले आने का प्रयास करें।`;
   h=`सुप्रभात, ${nm}। 🌞<br>आज आपकी उपस्थिति <b>${T(r.in_time)}</b> पर दर्ज हुई।<br>आप आज <b>${r.late_min} मिनट देर</b> से आए हैं।${r.prev_in?`<br>पिछली उपस्थिति: ${T(r.prev_in)}<br>आज: ${T(r.in_time)}`:''}<br>कल ${esc(r.cut)} से पहले आने का प्रयास करें।<br>छोटी-सी समय की पाबंदी पूरे दिन को बेहतर बना सकती है। 🌱`}
  msg(`✅ <b>उपस्थिति दर्ज हो गई</b><br>${nm} · ${type.toUpperCase()} समय: <b>${T(r[type+'_time'])}</b><br>GPS: सत्यापित ✓ · QR: सत्यापित ✓<br>${h}${type==='out'?'कुल समय: '+dur(r.in_time,r.out_time):''}${type==='out'&&r.status==='Half Day'&&r.half_reason!=='late_in'?'<br>OUT '+esc(r.half)+' से पहले होने के कारण आज की उपस्थिति <b>आधा दिन (Early OUT)</b> दर्ज हुई है।':''}`);
  if(ok)cele(r);else if(say)speak(say)}
 catch(e){msg('❌ '+esc(e.message))}}

// ---------- Admin ----------
function adm(){
 $('#v').innerHTML=`<div class=tabs>${[['today','आज'],['req','अनुरोध'],['staff','स्टाफ'],['rep','रिपोर्ट'],['cal','कैलेंडर'],['settings','सेटिंग्स'],['qr','QR Code']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';adm()">${l}</button>`).join('')}</div><div id=t></div>`;
 ({today:tToday,req:tReq,staff:tStaff,rep:tRep,cal:tCal,settings:tSet,qr:tQr})[tab]().catch(fail)}
async function tToday(){
 const{rows,notes,off,fin}=await api('admin/today'),C=[['कुल स्टाफ',()=>1],['समय पर',r=>r.status==='On Time'],['देर से',r=>r.status==='Late'],['आधा दिन',r=>r.half||r.status==='Half Day'],['छुट्टी',r=>r.leave],['अनुपस्थित',r=>r.status==='Absent'],['अभी दर्ज नहीं',r=>r.notmarked],['OUT दर्ज नहीं',r=>r.outmiss]];
 $('#t').innerHTML=`${off?'<div class=card>🗓️ आज अवकाश का दिन है।</div>':''}${finCard(fin)}<div class=g style="grid-template-columns:repeat(4,1fr)">${C.map(([l,f],i)=>`<div class=k style="cursor:pointer;${i===cat?'outline:2px solid #14532d':''}" onclick="cat=${i};tToday()"><b>${rows.filter(f).length}</b>${l}</div>`).join('')}</div>
 <div class="card w" style=margin-top:12px><b>${C[cat][0]}</b><table><tr><th>नाम<th>IN<th>OUT<th>स्थिति</tr>${rows.filter(C[cat][1]).map(r=>`<tr><td>${esc(r.name)}<td>${T(r.in_time)}${r.late_min?'<br><small>'+r.late_min+' मि. देर</small>':''}<td>${T(r.out_time)}<td>${r.status?chip(r.status)+rs(r):r.leave?chip('Leave'):r.half?'<span class="chip Half">आधा दिन</span>':off?'—':'अभी दर्ज नहीं'}`).join('')||'<tr><td colspan=4>कोई नहीं</tr>'}</table></div>
 <div class=card><b>🔔 हाल की गतिविधि</b>${notes.map(x=>`<p>${esc(x.msg)}</p>`).join('')||'<p>अभी कोई गतिविधि नहीं।</p>'}</div>`}
async function tReq(){

 return`<div class=card><b>स्वचालित अनुपस्थिति प्रक्रिया</b><br>${st}${f.last?'<br><small>अंतिम बार चली: '+fdt(f.last.ran_at)+' · '+esc(f.last.source)+'</small>':'<br><small>अभी तक कोई प्रक्रिया नहीं चली।</small>'}${!f.off&&!f.done&&f.due?'<br><button class="btn sm" onclick=runfin()>अभी चलाएँ</button>':''}</div>`},
runfin=async()=>{if(!confirm('आज की अनुपस्थिति प्रक्रिया अभी चलाएँ? जिन स्टाफ की उपस्थिति/छुट्टी दर्ज नहीं है वे अनुपस्थित दर्ज होंगे।'))return;try{await api('admin/finalize',{});tToday()}catch(e){alert(e.message)}},
del=async id=>{const n=SLm[id];if(!confirm(`⚠️ इस स्टाफ को स्थायी रूप से हटाना है?\n\nयह कार्य वापस नहीं किया जा सकेगा।\n\nस्टाफ: ${n}\n\nक्या आप वास्तव में इसे स्थायी रूप से हटाना चाहते हैं?`))return;
 if(prompt('पुष्टि के लिए बड़े अक्षरों में DELETE लिखें:')!=='DELETE')return alert('स्टाफ को हटाया नहीं गया।');
 try{await api('admin/staff/'+id+'/delete',{confirm:'DELETE'});alert('✅ स्टाफ का लॉगिन और प्रोफ़ाइल स्थायी रूप से हटा दिया गया। पुराना उपस्थिति रिकॉर्ड बिना नाम के सुरक्षित है।');tStaff()}catch(e){alert(e.message)}};
const HR={late_in:'Late IN',early_out:'Early OUT',both:'Late IN + Early OUT'},rs=r=>r.status==='Half Day'&&r.half_reason?'<br><small>'+HR[r.half_reason]+'</small>':'',
sumCard=s=>`<div class=g style="margin:8px 0">${[['कार्य दिवस',s.working_days],['समय पर',s.ontime],['देर से',s.late],['आधा दिन',s.half],['छुट्टी',s.leave_days],['अनुपस्थित',s.absent]].map(([l,v])=>`<div class=k><b>${v}</b>${l}</div>`).join('')}</div><div class=card style="text-align:center;background:#fffbeb"><div>🕒 Total Late Time</div><b style="font-size:26px">${esc(s.late_fmt)}</b></div>`;
async function srep(){try{const j=await api(`my/range?from=${$('#rf').value}&to=${$('#rt').value}`);
 $('#rr').innerHTML=sumCard(j.summary)+`<div class=w><table><tr><th>तारीख<th>IN<th>OUT<th>स्थिति<th>देर</tr>${j.rows.map(r=>`<tr><td>${dm(r.d)}<td>${T(r.in_time)}<td>${r.out_time?T(r.out_time):r.in_time&&r.d!==U.today?'<small>OUT दर्ज नहीं</small>':'—'}<td>${chip(r.status)}${rs(r)}<td>${r.late_min?r.late_min+' min':'—'}`).join('')}</table></div>`}catch(e){$('#rr').innerHTML='<p class=err>❌ '+esc(e.message)+'</p>'}}
setInterval(()=>{if(U&&U.role==='admin'&&!U.must_change&&tab==='today'&&$('#t')&&!document.activeElement.matches('input,select'))tToday().catch(()=>{})},30000);
api('me').then(u=>{U=u}).catch(()=>{}).finally(draw);
</script></body></html>
